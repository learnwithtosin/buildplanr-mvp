version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16

    # image: postgres:16

    container_name: buildplanr-db

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: buildplanr

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: